version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eims_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eims_db
      MYSQL_USER: eims_user
      MYSQL_PASSWORD: eims_password
    ports:
      - '3306:3306'
    volumes:
      - eims_mysql_data:/var/lib/mysql
    networks:
      - eims_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eims_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: eims_db
      DB_USER: eims_user
      DB_PASS: eims_password
      JWT_SECRET: change-this-to-a-strong-secret-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:4200
    ports:
      - '3000:3000'
    depends_on:
      - mysql
    volumes:
      - eims_uploads:/app/src/uploads
    networks:
      - eims_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eims_frontend
    restart: unless-stopped
    ports:
      - '4200:80'
    depends_on:
      - backend
    networks:
      - eims_network

networks:
  eims_network:
    driver: bridge

volumes:
  eims_mysql_data:
  eims_uploads:

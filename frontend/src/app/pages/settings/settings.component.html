<div class="page-container">
  <div class="page-header">
    <h1>Settings</h1>
    <p class="subtitle">Configure your business information</p>
  </div>

  @if (loading()) {
    <div class="eims-card"><div class="skeleton" style="height: 400px; border-radius: 6px;"></div></div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="settings-grid">
        <!-- Company Info -->
        <div class="eims-card">
          <h2 class="section-title">Company Information</h2>
          <div class="fields-col">
            <!-- Logo Upload -->
            <div class="logo-upload">
              <p class="field-label">Company Logo</p>
              <div class="logo-box" (click)="logoInput.click()">
                @if (logoPreview()) {
                  <img [src]="logoPreview()!" alt="Logo" class="logo-preview" />
                } @else {
                  <div class="upload-placeholder">
                    <mat-icon>add_photo_alternate</mat-icon>
                    <span>Click to upload logo</span>
                  </div>
                }
              </div>
              <input #logoInput type="file" accept="image/*" hidden (change)="onLogoChange($event)" />
            </div>

            <mat-form-field appearance="outline">
              <mat-label>Company Name</mat-label>
              <input matInput formControlName="company_name" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Phone Number</mat-label>
              <mat-icon matPrefix>phone</mat-icon>
              <input matInput formControlName="phone" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Address</mat-label>
              <textarea matInput formControlName="address" rows="3"></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Currency Symbol</mat-label>
              <input matInput formControlName="currency" placeholder="e.g. PKR, USD" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Receipt Footer Text</mat-label>
              <textarea matInput formControlName="receipt_footer" rows="2" placeholder="Thank you for your business!"></textarea>
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
          @if (saving()) { <mat-icon class="spin">refresh</mat-icon> }
          {{ saving() ? 'Saving...' : 'Save Settings' }}
        </button>
      </div>
    </form>
  }
</div>

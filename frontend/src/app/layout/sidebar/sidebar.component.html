<aside class="sidebar" [class.open]="open">
  <!-- Logo -->
  <div class="sidebar-header">
    <div class="logo-area">
      <div class="logo-icon">
        <mat-icon>bolt</mat-icon>
      </div>
      @if (open) {
        <div class="logo-text">
          <span class="logo-title">EIMS</span>
          <span class="logo-sub">Farhan Electronics</span>
        </div>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        [matTooltip]="!open ? item.label : ''"
        matTooltipPosition="right"
      >
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        @if (open) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <a class="nav-item logout-btn" (click)="auth.logout()" [matTooltip]="!open ? 'Logout' : ''" matTooltipPosition="right">
      <mat-icon class="nav-icon">logout</mat-icon>
      @if (open) {
        <span class="nav-label">Logout</span>
      }
    </a>
  </div>
</aside>
